system: {id: S, name: URL shortener, purpose: Turn long URLs into short links and redirect visitors}
stakeholders:
  - {id: SH1, name: Marketing team}
sources:
  - {id: SRC1, title: Marketing interview, stakeholder: SH1}
objectives:
  - {id: O1, name: Low running cost}
external:
  - {id: E1, name: Web visitor, kind: external, sends: [I1, I3], receives: [I2, I4]}
  - {id: E2, name: Build pipeline, kind: enabling}
items:
  - id: I1
    name: Long URL
    description: "The URL to shorten: an absolute http or https URL, 1 to 2000 characters. Example: https://example.com/spring-sale?utm=mail"
  - {id: I2, name: Short link}
  - {id: I3, name: Short code}
  - {id: I4, name: Redirect}
  - id: I5
    name: Link record
    description: "What is stored per link: code (6 characters, a-z0-9), target URL, created at (UTC time). Example: {code: k3x9qa, target: https://example.com, created: 2026-10-10T09:00Z}"
  - {id: I6, name: Stored target}
requirements:
  - {id: Q0, text: Functional requirements}
  - id: Q1
    text: The system shall create a short link for a submitted long URL.
    category: io
    subcategory: functional
    stage: release
    parent: Q0
    source: SRC1
    specifies: [F1]
  - id: Q2
    text: The system shall accept a long URL of up to 2000 characters.
    category: io
    subcategory: input
    stage: release
    parent: Q0
    source: SRC1
    specifies: [I1, F11]
  - id: Q3
    text: The system shall be available 99.9% of each month.
    category: system-wide
    subcategory: quality
    stage: release
    source: SRC1
    specifies: [S]
    threshold: 99.9% monthly availability
  - id: Q4
    text: The system shall cost less than 20 USD per month to run.
    category: system-wide
    subcategory: cost
    stage: release
    source: SRC1
    objective: O1
    specifies: [S]
functions:
  - {id: F0, name: Shorten and redirect}
  - {id: F1, name: Handle requests, parent: F0}
  - {id: F11, name: Create short link, parent: F1, inputs: [I1], outputs: [I2, I5], done_when: Short link returned, runs_in: C11}
  - {id: F12, name: Redirect visitor, parent: F1, inputs: [I3, I6], outputs: [I4], done_when: Visitor redirected, runs_in: C12}
  - {id: F2, name: Store links, parent: F0, inputs: [I5], outputs: [I6], done_when: Link persisted, runs_in: C2}
components:
  - {id: C1, name: Web service, parent: S, choice: Serverless functions}
  - {id: C11, name: Shorten endpoint, parent: C1}
  - {id: C12, name: Redirect endpoint, parent: C1}
  - {id: C2, name: Database, parent: S, choice: Managed key-value}
interfaces:
  - {id: IF1, name: Public HTTP, between: [E1, C1], carries: [I1, I2, I3, I4]}
  - {id: IF2, name: Storage access, between: [C1, C2], carries: [I5, I6]}
tests:
  - {id: T1, name: Create link end to end, method: automated, verifies: [Q1]}
  - id: T2
    name: Long URL accepted
    method: automated
    verifies: [Q2]
    description: "Submit a 2000-character URL: a short link comes back. Submit 2001 characters: refused with an error, nothing stored."
  - {id: T3, name: Availability probe, method: manual, verifies: [Q3]}
  - {id: T4, name: Monthly bill review, method: manual, verifies: [Q4]}
