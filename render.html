<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System model review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* App layout: steps + outline on the left, the picture (or table) in the middle, details on the right.
   Below 960px everything stacks into one scrolling column. */
:root {
  --paper: #fbfaf7; --ink: #2f2d3a; --muted: #6d6a7c; --line: #e4e1ea; --panel: #ffffff; --hover: #f3f1f8; --grid: #e2dfe9;
  --sys: #e9e3fb; --comp: #dcf3e6; --func: #ffe4d1; --ext: #dceefc; --enab: #eeedf2; --obj: #fdf0c4;
  --warn: #e8a33d; --warn-bg: #fdf1dc; --idea: #5b8fd6; --idea-bg: #e3eefb; --ok: #4f9e74; --ok-bg: #e1f3e8;
  --accent: #6b5bd6; --accent-bg: #ece9fb;
  --hand: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1d1c24; --ink: #ebe8f4; --muted: #a8a4b8; --line: #34323f; --panel: #24232d; --hover: #2d2b38; --grid: #33313e;
  --sys: #37304f; --comp: #24402f; --func: #4a3324; --ext: #213a4d; --enab: #2e2d36; --obj: #4a4220;
  --warn: #f0b660; --warn-bg: #43341b; --idea: #8fb6ec; --idea-bg: #22324a; --ok: #7cc79f; --ok-bg: #1f3a2b;
  --accent: #a99cf5; --accent-bg: #322d52; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1d1c24; --ink: #ebe8f4; --muted: #a8a4b8; --line: #34323f; --panel: #24232d; --hover: #2d2b38; --grid: #33313e;
  --sys: #37304f; --comp: #24402f; --func: #4a3324; --ext: #213a4d; --enab: #2e2d36; --obj: #4a4220;
  --warn: #f0b660; --warn-bg: #43341b; --idea: #8fb6ec; --idea-bg: #22324a; --ok: #7cc79f; --ok-bg: #1f3a2b;
  --accent: #a99cf5; --accent-bg: #322d52; color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.hand { font-family: var(--hand); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.app { --nav-w: 250px; --side-w: 340px; --lw: var(--nav-w); --rw: var(--side-w);
       height: 100%; display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw);
       grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "nav main side";
       transition: grid-template-columns .2s ease; }
.app[data-left="closed"] { --lw: 0px; }
.app[data-right="closed"] { --rw: 0px; }
.app.still, .app.still * { transition: none !important; }
/* panels slide shut; their inner box keeps its width so text never reflows mid-slide */
.nav, .side { overflow: hidden; min-width: 0; transition: visibility 0s; }
.app[data-left="closed"] .nav, .app[data-right="closed"] .side { visibility: hidden; border-color: transparent; transition: visibility 0s .2s; }

/* top bar */
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.iconbtn { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.iconbtn[aria-expanded="false"] .fill { opacity: 0; }
.stepnow { display: none; flex: none; background: var(--accent-bg); border: 0; border-radius: 999px; padding: 2px 12px; cursor: pointer; white-space: nowrap; }
.app[data-left="closed"] .stepnow { display: inline-block; }
.top .mark { font: 1.05rem var(--hand); color: var(--accent); white-space: nowrap; }
.top h1 { font: 1.5rem/1.1 var(--hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .purpose { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.lvl { display: flex; gap: 4px; align-items: center; flex: none; max-width: 100%; flex-wrap: wrap; color: var(--muted); }
.lvl:empty { display: none; }
.lvl button { background: none; border: 0; padding: 1px 6px; border-radius: 6px; color: var(--accent); cursor: pointer; white-space: nowrap; }
.lvl button:hover { background: var(--hover); }
.lvl button.lvchip { background: var(--accent-bg); border-radius: 999px; padding: 2px 10px; font-size: .8rem; }
.lvl button.lvchip:disabled { background: none; border: 1px dashed var(--line); color: var(--muted); cursor: default; }
.lvl .you { font-weight: 700; }
.pill { font-size: .8rem; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.pill.warn { background: var(--warn-bg); border: 1px solid var(--warn); }
.pill.ok { background: var(--ok-bg); }

/* left: steps + outline */
.nav { grid-area: nav; border-right: 1px solid var(--line); }
.nav-in { width: var(--nav-w); height: 100%; box-sizing: border-box; overflow: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-inline: 8px; }
.steps { display: grid; gap: 2px; margin-top: 6px; }
.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-radius: 10px; padding: 7px 8px; cursor: pointer; }
.step:hover:not(:disabled) { background: var(--hover); }
.step[aria-current="step"] { background: var(--accent-bg); }
.step:disabled { cursor: default; opacity: .5; }
.step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 1rem var(--hand); border: 1.5px solid var(--muted); }
.step[aria-current="step"] .n { border-color: var(--accent); color: var(--accent); }
.step b { font-weight: 700; display: block; }
.step small { color: var(--muted); display: block; font-size: .78rem; line-height: 1.3; }
.count { font-size: .75rem; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: var(--warn-bg); border: 1px solid var(--warn); }
.count.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.step .turn { display: block; font-size: .75rem; color: var(--muted); }
.step .turn.you { color: var(--accent); font-weight: 700; }
.waiting { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.waiting h4 { margin: 0; }
.waiting h5.from { margin: 4px 0 0; font-size: .95rem; }
.alldone { border: 1px solid var(--ok); background: var(--ok-bg); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.changed ul { margin: 2px 0 0; padding-left: 1.3em; display: grid; gap: 2px; }
.count.later { background: none; border: 0; color: var(--muted); }
.step .n.ok { background: var(--ok); border-color: var(--ok); color: var(--panel); font-family: var(--body); }
.step .n.back { background: var(--warn-bg); border-color: var(--warn); font-family: var(--body); }
.step .n.stale { border: 1.5px dashed var(--warn); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 14px; border-left: 1px dashed var(--line); margin-left: 12px; }
.tree { margin-top: 6px; }
.tree button { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 3px 8px; cursor: pointer; font-size: .9rem; }
.tree button:hover { background: var(--hover); }
.tree button.here { font-weight: 700; }
.tree button[aria-selected="true"] { background: var(--accent-bg); }
.tree .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; border: 1px solid var(--muted); }
.tree .dotw { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; margin-left: auto; }

/* middle */
.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; box-sizing: border-box; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.tabs button:hover { background: var(--hover); }
.tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); font-weight: 700; }
.crumbs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font: 1.1rem var(--hand); color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 1px 6px; border-radius: 6px; color: var(--accent); cursor: pointer; }
.crumbs button:hover { background: var(--hover); }
.crumbs button[aria-current="true"] { color: var(--ink); cursor: default; background: none; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--paper);
         background-image: radial-gradient(var(--grid) 1.2px, transparent 1.3px); background-size: 22px 22px; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
.stage svg.panning { cursor: grabbing; }
#vp { transform-origin: 0 0; }
#vp.anim { transition: transform .22s ease-in; }
#content { transition: opacity .18s ease-out; }
.node { cursor: pointer; }
.node:focus-visible { outline: none; }
.node:focus-visible > rect:first-child { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.edge { cursor: pointer; transition: opacity .15s; }
.edge.dim { opacity: .18; }
.zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
.zoombar button { background: none; border: 0; min-width: 32px; height: 30px; border-radius: 7px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoombar button:hover { background: var(--hover); }
.hint { position: absolute; left: 12px; bottom: 12px; font-size: .8rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; max-width: calc(100% - 220px); }
.emptymsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font: 1.3rem var(--hand); color: var(--muted); }
.page { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tools input[type="search"] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; min-width: 0; width: 260px; max-width: 100%; }
.tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; background: var(--panel); border-radius: 10px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { font-weight: 700; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: sticky; top: -16px; background: var(--panel); }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover { background: var(--hover); }
tbody tr[aria-selected="true"] { background: var(--accent-bg); }
td.id { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
tr.group td { font: 1.1rem var(--hand); color: var(--muted); padding-top: 14px; }
.chip { display: inline-block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.chip.error { background: var(--warn-bg); border: 1px solid var(--warn); }
.chip.warning { background: var(--warn-bg); color: var(--muted); }
.chip.advice { background: var(--idea-bg); }
.chip.ok { background: var(--ok-bg); }
.scen { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h3 { font: 1.25rem var(--hand); margin-bottom: 6px; }
.card ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }

/* right: inspector */
.side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel); }
.side-in { width: var(--side-w); height: 100%; box-sizing: border-box; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.side h2 { font: 1.6rem/1.15 var(--hand); text-wrap: balance; }
.side h4 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-bottom: 8px; }
.back { align-self: flex-start; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; }
.kindline { color: var(--muted); font-size: .85rem; }
.kindline code { font-size: .8rem; background: var(--hover); border-radius: 5px; padding: 0 5px; }
.guide { background: var(--hover); border-radius: 10px; padding: 10px 12px; }
.probs { display: grid; gap: 8px; }
.prob { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.prob:hover { border-color: var(--accent); }
.prob .chip { margin-right: 6px; }
.prob .ref { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.notes { display: grid; gap: 8px; }
.notes h5, .notes h6 { font-size: .95rem; margin: 4px 0 0; }
.notes ul { margin: 0; padding-left: 1.3em; display: grid; gap: 3px; }
.notes code { font-size: .85rem; background: var(--hover); border-radius: 5px; padding: 0 4px; }
.notes .scroll { overflow-x: auto; }
.clean { font: 1.15rem var(--hand); color: var(--ok); }
dl.facts { margin: 0; display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 8px 12px; }
dl.facts dt { color: var(--muted); font-size: .85rem; }
dl.facts dd { margin: 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; overflow-wrap: anywhere; }
.link { background: var(--hover); border: 0; border-radius: 6px; padding: 0 7px; cursor: pointer; color: var(--accent); text-align: left; }
.link:hover { text-decoration: underline; }
.primary { align-self: flex-start; background: var(--accent); color: var(--panel); border: 0; border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 700; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks label { display: grid; grid-template-columns: auto 1fr; gap: 10px; cursor: pointer; }
.checks input { margin-top: .3em; accent-color: var(--accent); }
.review { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
.review h4 { margin-bottom: 0; }
.revstate .chip { margin-right: 6px; }
.chip.none { border: 1px solid var(--line); color: var(--muted); }
.revnote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); white-space: pre-wrap; }
.review textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 76px; resize: vertical; width: 100%; box-sizing: border-box; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.secondary { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 15px; cursor: pointer; }
.secondary:hover { background: var(--hover); }
.primary:disabled { opacity: .45; cursor: default; }
.says { font-size: 1.02rem; }

@media (max-width: 960px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; height: auto; min-height: 100%; }
  .top { flex-wrap: wrap; }
  .top .purpose { flex-basis: 100%; white-space: normal; }
  .top .purpose, #down, #status { order: 1; }            /* both panel buttons stay on the first row */
  .top h1 { flex: 1; min-width: 0; }
  .nav { border-right: 0; border-bottom: 1px solid var(--line); }
  .nav-in, .side-in { width: auto; height: auto; overflow: visible; }
  .nav-in { padding: 8px 16px; }
  .app[data-left="closed"] .nav, .app[data-right="closed"] .side { display: none; }
  .nav .eyebrow, .outline { display: none; }
  .steps { display: flex; overflow-x: auto; gap: 4px; margin: 0; }
  .step { grid-template-columns: auto auto auto; flex: none; }
  .step small { display: none; }
  .bar { padding-inline: 16px; }
  .stage { flex: none; height: 62vh; min-height: 320px; }
  .page { padding-inline: 16px; overflow: visible; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .hint { display: none; }
  .crumbs > :not(:nth-last-child(-n+3)) { display: none; }   /* phones: only the parent and where you are */
}
@media (prefers-reduced-motion: reduce) { #vp.anim, #content, .edge { transition: none; } }
</style>
</head>
<body>
<div class="app still">
  <header class="top">
    <button class="iconbtn" id="tleft" aria-controls="nav" aria-expanded="true" aria-label="Steps panel"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="2.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 2.5v13" stroke="currentColor" stroke-width="1.5"/><rect class="fill" x="2.5" y="3.5" width="3.5" height="11" rx="1" fill="currentColor" opacity=".45"/></svg></button>
    <span class="mark">sysmodel</span>
    <nav class="lvl" id="up" aria-label="Levels above"></nav>
    <h1 id="sysname"></h1>
    <button class="stepnow" id="stepnow" title="Show the steps panel"></button>
    <span class="purpose" id="purpose"></span>
    <nav class="lvl" id="down" aria-label="Levels below"></nav>
    <span id="status"></span>
    <button class="iconbtn" id="tright" aria-controls="side" aria-expanded="true" aria-label="Details panel"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="2.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11.5 2.5v13" stroke="currentColor" stroke-width="1.5"/><rect class="fill" x="12" y="3.5" width="3.5" height="11" rx="1" fill="currentColor" opacity=".45"/></svg></button>
  </header>
  <nav class="nav" id="nav" aria-label="Steps">
    <div class="nav-in">
      <div><div class="eyebrow">Steps</div><div class="steps" id="steps"></div></div>
      <div class="outline" id="outline-wrap"><div class="eyebrow" id="outline-title">Outline</div><ul class="tree" id="outline"></ul></div>
    </div>
  </nav>
  <main class="main">
    <div class="bar"><div class="tabs" id="tabs" role="tablist"></div><div class="crumbs" id="crumbs" aria-label="Level"></div></div>
    <div class="stage" id="stage">
      <svg id="svg" aria-label="Diagram"><g id="vp"><g id="content"></g><g id="overlay" pointer-events="none"></g></g></svg>
      <div class="emptymsg" id="emptymsg" hidden></div>
      <div class="hint" id="hint"></div>
      <div class="zoombar">
        <button id="zout" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="zpct" title="Actual size" aria-label="Actual size">100%</button>
        <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="zfit" title="Fit to screen (Shift+1)">Fit</button>
      </div>
    </div>
    <div class="page" id="page" hidden></div>
  </main>
  <aside class="side" id="side" aria-label="Details"><div class="side-in" id="side-in"></div></aside>
</div>

<script type="application/json" id="data">/*DATA*/null</script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const m = D.model, NS = "http://www.w3.org/2000/svg", FONT = 18, LABEL_FONT = 16;
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const touch = matchMedia("(pointer: coarse)").matches;

  const STEPS = {
    1: { q: "Who uses it, and what must it do?", check: "Check the outside systems, the items they swap, and the requirements. Each requirement should be one clear sentence you could test." },
    2: { q: "What does it do, step by step?", check: "Check that the jobs cover everything the app must do, with no overlaps and no gaps." },
    3: { q: "What is it made of?", check: "Check that the parts cover the whole app, with no overlaps." },
    4: { q: "Which part does each job?", check: "Each job should sit in exactly one part, and every part should have at least one job." },
    5: { q: "How do the parts connect?", check: "Every item that moves between two parts needs a connection that carries it." },
    6: { q: "How will we prove it works?", check: "Every input/output and system-wide requirement needs a test that proves it." },
  };
  const SEV = { error: "Must fix", warning: "Worth a look", advice: "Idea" };
  const KIND = { system: ["The system", ""], function: ["Job", "function"], component: ["Part", "component"],
    external: ["Outside system", "external system"], enabling: ["Helper system", "enabling system"],
    context: ["Outside influence", "context"], item: ["Item", "item"], requirement: ["Requirement", ""],
    interface: ["Connection", "interface"], objective: ["Objective", ""], test: ["Test", ""],
    scenario: ["Scenario", "operational scenario"], source: ["Source", ""], stakeholder: ["Stakeholder", ""] };

  // ---------------- model index ----------------
  const list = k => (D.drawable && Array.isArray(m[k]) ? m[k] : []);
  const byId = {};
  if (D.drawable) {

  try { restore = JSON.parse(sessionStorage.getItem("sysmodel.view")); sessionStorage.removeItem("sysmodel.view"); } catch (e) {}
  const saveDrafts = () => { try { sessionStorage.setItem(DRAFTS, JSON.stringify(drafts)); } catch (e) {} };
  const draft = n => (drafts[n] ??= { note: "", checked: [...(D.review[n]?.last?.checked || [])] });
  const when = at => new Date(at).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  function reviewOf(n) {   // [step mark, short word, sentence]

  // decisions.md: one "## Step N Name" section per step; its "### Waiting for your yes" part is split off here.

  function mdBlocks(text) {

  function reviewCard() {
